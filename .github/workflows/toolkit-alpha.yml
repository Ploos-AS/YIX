name: Toolkit alpha checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s toolkit -p 'test_*.py'
      - run: |
          for inventory in toolkit/examples/*.json; do
            python toolkit/muixctl.py validate "$inventory" || exit 1
            python toolkit/muixctl.py plan "$inventory" || exit 1
          done
      - run: python tools/check_alpha_links.py
