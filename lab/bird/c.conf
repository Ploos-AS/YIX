router id 192.0.2.13;
protocol device {}
protocol static own4 { ipv4; route 198.51.100.128/26 blackhole; }
protocol static own6 { ipv6; route 2001:db8:13::/48 blackhole; }
protocol bgp rs4 {
 local as 65003;
 neighbor 192.0.2.10 as 65000;
 
 ipv4 {
 import all;
 export filter { if net = 198.51.100.128/26 then accept; reject; };
 };
}
protocol bgp rs6 {
 local as 65003;
 neighbor 2001:db8:1::10 as 65000;
 
 ipv6 {
 import all;
 export filter { if net = 2001:db8:13::/48 then accept; reject; };
 };
}
