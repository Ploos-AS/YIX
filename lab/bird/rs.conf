router id 192.0.2.10;
protocol device {}
roa4 table lab_roa4;
roa6 table lab_roa6;
protocol rpki lab_rtr {
 roa4 { table lab_roa4; };
 roa6 { table lab_roa6; };
 remote 192.0.2.30 port 3323;
}
protocol bgp a4 {
 local as 65000;
 neighbor 192.0.2.11 as 65001;
 rs client;
 ipv4 {
 import table on;
 receive limit 4 action disable;
 import limit 2 action disable;
 rpki reload on;
 import filter { if roa_check(lab_roa4, net, bgp_path.last) = ROA_INVALID then reject; if (net = 198.51.100.0/26 || net = 192.0.2.128/25) && bgp_path.first = 65001 && bgp_path.last = 65001 then accept; reject; };
 export filter { if (65000, 0, 65001) ~ bgp_large_community then reject; accept; };
 };
}
